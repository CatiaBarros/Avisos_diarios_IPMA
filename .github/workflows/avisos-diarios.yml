name: Gerar CSVs de Avisos IPMA

on:
  schedule:
    # De 1h30 em 1h30 (UTC). Minutos "estranhos" de propósito: às horas certas
    # o GitHub está sobrecarregado e atrasa os agendamentos várias horas.
    - cron: '7 0-23/3 * * *'    # 00h07, 03h07, 06h07, 09h07 …
    - cron: '37 1-23/3 * * *'   # 01h37, 04h37, 07h37, 10h37 …
  workflow_dispatch:            # Execução manual (e disparo externo, ex. cron-job.org)

# Nunca correm duas atualizações ao mesmo tempo (evita conflitos no push)
concurrency:
  group: avisos-ipma
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gerar-avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true   # pacotes já compilados: instalação muito mais rápida

      - name: Instalar pacotes R
        # Instala com pak e guarda em cache: os runs seguintes reaproveitam os pacotes
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr
            any::jsonlite
            any::dplyr
            any::readr
            any::lubridate
            any::tidyr
            any::stringr
            any::stringi

      - name: Gerar CSVs
        run: Rscript gerar_csvs.R

      - name: Comitar e enviar os ficheiros gerados
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add *.csv metadata_avisos.json
          if git diff --cached --quiet; then
            echo "Sem alterações."
            exit 0
          fi
          git commit -m "📦 Atualização de avisos IPMA - $(TZ=Europe/Lisbon date +'%Y-%m-%d %Hh%M')"
          git pull --rebase origin main
          git push origin HEAD:main
